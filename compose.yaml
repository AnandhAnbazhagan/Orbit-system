  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "mysql+pymysql://orbit_app:${MYSQL_APP_PASSWORD}@mysql:3306/embsys_orbit"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: embsys_orbit
      DB_USER: orbit_app
      DB_PASSWORD: Anandh@2013
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      FRONTEND_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      MAX_UPLOAD_MB: 10
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads