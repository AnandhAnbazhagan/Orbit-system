
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Orbit System - Teams</title>

    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
    

    <style>
        .teams-page {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .teams-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .teams-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .teams-toolbar .search {
            flex: 1;
            min-width: 200px;
        }

        .teams-toolbar select {
            min-width: 160px;
            padding: 10px 12px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            background: white;
        }

        .teams-table-wrap {
            width: 100%;
            overflow-x: auto;
        }

        .teams-table {
            width: 100%;
            min-width: 850px;
            border-collapse: collapse;
        }

        .teams-table th,
        .teams-table td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid #eaecf0;
            font-size: 13px;
        }

        .teams-table th {
            background: #f9fafb;
            color: #667085;
            font-size: 11px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .teams-table td {
            color: #344054;
        }

        .team-name {
            font-weight: 650;
            color: #101828;
        }

        .team-description {
            max-width: 250px;
            overflow-wrap: anywhere;
        }

        .team-status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            background: #ecfdf3;
            color: #027a48;
            font-size: 11px;
            font-weight: 650;
        }

        .team-status.inactive {
            background: #f2f4f7;
            color: #667085;
        }

        .team-actions {
            display: flex;
            gap: 7px;
        }

        .team-action {
            padding: 7px 10px;
            border: 1px solid #d0d5dd;
            border-radius: 7px;
            background: white;
            cursor: pointer;
        }

        .team-action:hover {
            background: #f2f4f7;
        }

        .team-empty {
            padding: 35px !important;
            text-align: center !important;
            color: #667085 !important;
        }

        .team-modal {
            position: fixed;
            inset: 0;
            z-index: 5000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(16, 24, 40, .55);
        }

        .team-modal.show {
            display: flex;
        }

        .team-modal-box {
            width: min(600px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            background: white;
            border-radius: 14px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .2);
        }

        .team-modal-header,
        .team-modal-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 18px 22px;
            border-bottom: 1px solid #eaecf0;
        }

        .team-modal-footer {
            justify-content: flex-end;
            border-top: 1px solid #eaecf0;
            border-bottom: 0;
        }

        .team-modal-header h2 {
            margin: 0;
            font-size: 18px;
        }

        .team-modal-body {
            padding: 22px;
        }

        .team-form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .team-field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .team-field.full {
            grid-column: 1 / -1;
        }

        .team-field label {
            font-size: 12px;
            font-weight: 600;
            color: #344054;
        }

        .team-field input,
        .team-field select,
        .team-field textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            background: white;
            font: inherit;
            font-size: 13px;
        }

        .team-field textarea {
            min-height: 90px;
            resize: vertical;
        }

        .team-close {
            border: 0;
            background: transparent;
            font-size: 24px;
            cursor: pointer;
        }

        @media (max-width: 650px) {
            .teams-heading {
                align-items: flex-start;
                flex-direction: column;
            }

            .team-form-grid {
                grid-template-columns: 1fr;
            }

            .team-field.full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>
<div class="app">

    <aside class="sidebar" id="sidebar">
        <div class="logo">
            <span class="logo-mark">◉</span>
            Orbit system
        </div>

        <div class="nav-section">WORKSPACE</div>
        <a class="nav-link" href="../dashboard.html">◉ Dashboard</a>
        <a class="nav-link" href="projects.html">▣ Projects</a>
        <a class="nav-link" href="tasks.html">✓ Tasks</a>
        <a class="nav-link active" href="teams.html">♢ Teams</a>
        <a class="nav-link" href="inventory.html">▤ Inventory</a>

        <div class="nav-section">ORGANIZATION</div>
        <a class="nav-link" href="employees.html">♙ Employees</a>
        <a class="nav-link" href="reports.html">◫ Reports</a>
        <a class="nav-link" href="notifications.html">◌ Notifications</a>
        <a class="nav-link" href="chat.html">☵ Chat</a>

        <div class="nav-section">SYSTEM</div>
        <a class="nav-link" href="settings.html">⚙ Settings</a>
        <a class="nav-link" href="#" id="logoutButton">↪ Logout</a>
    </aside>

    <main class="main">
        <header class="topbar">
            <button class="btn secondary menu-toggle"
                    id="sidebarToggle" type="button">☰</button>

            <input class="search"
                   id="workspaceSearch"
                   placeholder="Search workspace..."
                   aria-label="Search workspace">

            <div class="profile">
                <div class="avatar">O</div>
            </div>
        </header>

        <section class="content teams-page">
            <div class="teams-heading">
                <div>
                    <span class="eyebrow">ORBIT / TEAMS</span>
                    <h1>Teams</h1>
                </div>

                <button class="btn primary"
                        id="addTeamButton"
                        type="button">+ Add Team</button>
            </div>

            <div class="card">
                <div class="teams-toolbar">
                    <input class="search"
                           id="teamSearch"
                           placeholder="Search teams..."
                           aria-label="Search teams">

                    <select id="teamStatusFilter"
                            aria-label="Filter by status">
                        <option value="">All statuses</option>
                        <option value="ACTIVE">Active</option>
                        <option value="INACTIVE">Inactive</option>
                    </select>

                    <button class="btn secondary"
                            id="exportTeamsButton"
                            type="button">Export</button>
                </div>

                <div class="teams-table-wrap">
                    <table class="teams-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Team Name</th>
                                <th>Department</th>
                                <th>Leader</th>
                                <th>Description</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="tableBody">
                            <tr>
                                <td colspan="7" class="team-empty">
                                    Loading teams...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>
</div>

<!-- ADD / EDIT TEAM MODAL -->
<div class="team-modal" id="teamModal" aria-hidden="true">
    <div class="team-modal-box"
         role="dialog"
         aria-modal="true"
         aria-labelledby="teamModalTitle">

        <div class="team-modal-header">
            <h2 id="teamModalTitle">Add Team</h2>
            <button class="team-close"
                    id="closeTeamModal"
                    type="button"
                    aria-label="Close">×</button>
        </div>

        <form id="teamForm">
            <div class="team-modal-body">
                <div class="team-form-grid">

                    <div class="team-field">
                        <label for="teamName">Team Name *</label>
                        <input id="teamName"
                               name="name"
                               required
                               maxlength="150">
                    </div>

                    <div class="team-field">
                        <label for="teamDepartment">Department</label>
                        <input id="teamDepartment"
                               name="department"
                               maxlength="150">
                    </div>

                    <div class="team-field">
                        <label for="teamLeader">Leader Employee ID</label>
                        <input id="teamLeader"
                               name="leader_id"
                               type="number"
                               min="1">
                    </div>

                    <div class="team-field">
                        <label for="teamStatus">Status</label>
                        <select id="teamStatus" name="status">
                            <option value="ACTIVE">Active</option>
                            <option value="INACTIVE">Inactive</option>
                        </select>
                    </div>

                    <div class="team-field full">
                        <label for="teamDescription">Description</label>
                        <textarea id="teamDescription"
                                  name="description"
                                  maxlength="1000"></textarea>
                    </div>

                </div>
            </div>

            <div class="team-modal-footer">
                <button class="btn secondary"
                        id="cancelTeamButton"
                        type="button">Cancel</button>

                <button class="btn primary"
                        id="saveTeamButton"
                        type="submit">Save Team</button>
            </div>
        </form>
    </div>
</div>

<a class="nav-link" href="#" onclick="
    localStorage.removeItem('orbit_token');
    localStorage.removeItem('orbit_user');
    location.href='../login.html';
    return false;
">↪ Logout</a>


<div id="toast" class="toast"></div>

<script src="../js/api.js"></script>
<script src="../js/teams.js"></script>

<script>
    document.getElementById("sidebarToggle").addEventListener("click", () => {
        document.getElementById("sidebar").classList.toggle("open");
    });

    document.getElementById("logoutButton").addEventListener("click", event => {
        event.preventDefault();
        localStorage.removeItem("orbit_token");
        localStorage.removeItem("orbit_user");
        window.location.href = "../login.html";
    });
</script>

</body>
</html>
